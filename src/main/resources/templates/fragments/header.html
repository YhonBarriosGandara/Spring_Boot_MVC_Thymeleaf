<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | AgroFincas UDC' : 'AgroFincas UDC'}">AgroFincas UDC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --agro-primary: #2e7d32;
            --agro-dark: #1b5e20;
            --agro-light: #e8f5e9;
            --agro-accent: #66bb6a;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .navbar-agro {
            background-color: var(--agro-dark);
        }
        .navbar-agro .navbar-brand, .navbar-agro .nav-link {
            color: #ffffff;
        }
        .navbar-agro .nav-link:hover {
            color: #c8e6c9;
        }
        .navbar-agro .nav-link.active {
            color: #ffffff;
            font-weight: 600;
            border-bottom: 2px solid #a5d6a7;
        }
        .btn-agro {
            background-color: var(--agro-primary);
            color: #ffffff;
            border: none;
        }
        .btn-agro:hover {
            background-color: var(--agro-dark);
            color: #ffffff;
        }
        .card-header-agro {
            background-color: var(--agro-primary);
            color: #ffffff;
            font-weight: 600;
        }
        .badge-prod {
            font-size: 0.8rem;
            padding: 0.35em 0.65em;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<!-- Fragmento Navbar -->
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark navbar-agro shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
            <i class="bi bi-tree-fill text-success-emphasis bg-light p-1 rounded"></i>
            <span class="fw-bold">AgroFincas</span>
            <small class="badge bg-success-subtle text-success border border-success-subtle ms-1">Spring MVC</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'fincas' ? 'active' : ''}" th:href="@{/fincas}">
                        <i class="bi bi-geo-alt-fill me-1"></i> Fincas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'usuarios' ? 'active' : ''}" th:href="@{/usuarios}">
                        <i class="bi bi-people-fill me-1"></i> Usuarios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'reportes' ? 'active' : ''}" th:href="@{/reportes}">
                        <i class="bi bi-file-earmark-bar-graph-fill me-1"></i> Reportes
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item dropdown" th:if="${session.usuarioLogueado != null}">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center gap-1" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span th:text="${session.usuarioLogueado.nombre}">Usuario</span>
                        <span class="badge bg-light text-success ms-1" th:text="${session.usuarioLogueado.rol}">Rol</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><span class="dropdown-item-text text-muted small" th:text="${session.usuarioLogueado.email}">correo@unicartagena.edu.co</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" th:href="@{/logout}">
                                <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item" th:if="${session.usuarioLogueado == null}">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Fragmento de Mensajes y Alertas -->
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${mensajeExito != null}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}">Operación exitosa</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError != null}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}">Error en la operación</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeInfo != null}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${mensajeInfo}">Información del sistema</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

</body>
</html>
